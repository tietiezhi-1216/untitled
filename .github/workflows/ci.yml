name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to verify before publishing
        required: true
        type: string
      approved_source:
        description: Allow an explicitly approved maintenance snapshot with the older source layout
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify host and plugin version transitions
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release_plan.py --source "$GITHUB_SHA" --base "$BASE"
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Validate agent delivery automation without credentials
        if: ${{ !inputs.approved_source || hashFiles('.github/scripts/agent-pr.test.cjs') != '' }}
        run: |
          node --test .github/scripts/agent-pr.test.cjs
          python3 -m unittest discover -s Tests/Automation
      - name: Validate SwiftPM and Xcode module boundaries
        if: ${{ !inputs.approved_source || hashFiles('scripts/check-module-boundaries.py') != '' }}
        run: python3 scripts/check-module-boundaries.py
      - name: Build and test
        run: swift test --sdk "$(xcrun --sdk macosx --show-sdk-path)" --no-parallel
      - name: Validate plugin packages
        run: |
          python3 scripts/prepare-plugin-resources.py --check
          python3 scripts/package-plugins.py --tag v0.13.56
      - name: Build app
        env:
          UNTITLED_SIGNING_IDENTITY: '-'
        run: ./scripts/build-app.sh release
      - name: Build Xcode target
        run: |
          xcodebuild -project Untitled.xcodeproj -scheme Untitled -configuration Debug -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/untitled-xcode" CODE_SIGNING_ALLOWED=NO build
      - name: Verify the Xcode-built app SDK
        if: ${{ !inputs.approved_source || hashFiles('scripts/check-app-sdk.sh') != '' }}
        run: /bin/bash scripts/check-app-sdk.sh "$RUNNER_TEMP/untitled-xcode/Build/Products/Debug/Untitled.app"
