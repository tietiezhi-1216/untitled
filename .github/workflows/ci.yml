name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Validate agent delivery automation without credentials
        run: |
          node --test .github/scripts/agent-pr.test.cjs
          python3 -m unittest discover -s Tests/Automation
      - name: Build and test
        run: swift test --no-parallel
      - name: Validate plugin packages
        run: |
          python3 scripts/prepare-plugin-resources.py --check
          python3 scripts/package-plugins.py --tag v0.12.5
      - name: Build app
        run: ./scripts/build-app.sh release
      - name: Build Xcode target
        run: xcodebuild -project Untitled.xcodeproj -scheme Untitled -configuration Debug CODE_SIGNING_ALLOWED=NO build
