name: macOS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Validate agent delivery automation without credentials
        run: |
          node --test .github/scripts/agent-pr.test.cjs
          python3 -m unittest discover -s Tests/Automation
      - name: Validate SwiftPM and Xcode module boundaries
        run: python3 scripts/check-module-boundaries.py
      - name: Build and test
        run: swift test --sdk "$(xcrun --sdk macosx --show-sdk-path)" --no-parallel
      - name: Validate plugin packages
        run: |
          python3 scripts/prepare-plugin-resources.py --check
          python3 scripts/package-plugins.py --tag v0.13.56
      - name: Build app
        env:
          UNTITLED_SIGNING_IDENTITY: '-'
        run: ./scripts/build-app.sh release
      - name: Build Xcode target
        run: |
          xcodebuild -project Untitled.xcodeproj -scheme Untitled -configuration Debug -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/untitled-xcode" CODE_SIGNING_ALLOWED=NO build
          /bin/bash scripts/check-app-sdk.sh "$RUNNER_TEMP/untitled-xcode/Build/Products/Debug/Untitled.app"
